
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dependances
        run: |
          pip install -r requirements-dev.txt
          pip install "dvc[http]==3.67.1"

      - name: Configurer les acces DagsHub
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local origin auth basic
          dvc remote modify --local origin user "$DAGSHUB_USERNAME"
          dvc remote modify --local origin password "$DAGSHUB_TOKEN"

      - name: Recuperer les donnees et modeles
        run: dvc pull data/Livraisons.csv.dvc models.dvc

      - name: Lancer les tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Installer DVC
        run: pip install "dvc[http]==3.67.1"

      - name: Configurer les acces DagsHub
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local origin auth basic
          dvc remote modify --local origin user "$DAGSHUB_USERNAME"
          dvc remote modify --local origin password "$DAGSHUB_TOKEN"

      - name: Recuperer le modele
        run: dvc pull models.dvc

      - uses: docker/setup-buildx-action@v3

      - name: Definir les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omegarak/projet-ia
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Construire l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: api-retards:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tester le conteneur
        run: |
          docker run -d --name api -p 8000:8000 api-retards:test
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo
              echo "API OK"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas demarre :"
          docker logs api
          exit 1

      - name: Connexion a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image Docker
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
