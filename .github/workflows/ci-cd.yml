name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Annule l'exécution précédente si on repousse sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI : tests de l'API ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v

  # ---------- CD : image Docker testée puis publiée sur ghcr.io ----------
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Noms et tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      # 1) Construire l'image en local pour la tester
      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: api-retards:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Démarrer le conteneur et vérifier qu'il répond
      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 api-retards:test
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo; echo "API OK"; exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas démarré :"
          docker logs api
          exit 1

      # 3) Publier (uniquement sur main et sur les tags, jamais sur une pull request)
      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
