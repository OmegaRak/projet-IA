name: Train

on:
  # Se déclenche UNIQUEMENT quand ce fichier change sur main
  push:
    branches: [main]
    paths:
      - "src/train_mlflow.py"
  # Lancement manuel possible depuis l'onglet Actions (avec choix des hyperparamètres)
  workflow_dispatch:
    inputs:
      max_depth:
        description: "Profondeur max des arbres"
        default: "12"
      min_samples_leaf:
        description: "Nombre min d'échantillons par feuille"
        default: "5"

# Évite deux entraînements simultanés
concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      # À adapter : le dépôt DagsHub où enregistrer les expériences
      DAGSHUB_REPO_OWNER: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      DAGSHUB_REPO_NAME: projet-IA
      # Secrets à créer dans GitHub : Settings > Secrets and variables > Actions
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt mlflow==3.17.1 matplotlib==3.11.2 seaborn

      - name: Entraîner et enregistrer sur DagsHub
        run: |
          python src/train_mlflow.py \
            --run-name "ci-${GITHUB_SHA::7}" \
            --max-depth "${{ inputs.max_depth || 12 }}" \
            --min-samples-leaf "${{ inputs.min_samples_leaf || 5 }}"
